<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>梁山点算司 · 能升多少级</title>
<style>
:root{--ink:#12100f;--paper:#f2e5c8;--gold:#d8a72b;--red:#b02b2b;--red2:#7d1c1c;--jade:#2f6b5f;--muted:#a99574}
*{box-sizing:border-box}
body{
  margin:0;padding:18px 12px 44px;min-height:100vh;color:var(--paper);
  font-family:"Noto Serif SC","Songti SC","STSong",serif;
  background:radial-gradient(900px 480px at 50% -10%,#2a2118 0%,transparent 62%),linear-gradient(160deg,#171310 0%,#0d0b0a 100%);
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.1;
  background-image:repeating-radial-gradient(circle at 50% 118%,transparent 0 40px,#d8a72b 41px 42px);
  -webkit-mask-image:linear-gradient(to top,#000 0,transparent 60%);mask-image:linear-gradient(to top,#000 0,transparent 60%);
}
.wrap{max-width:820px;margin:0 auto;position:relative;z-index:2}
.head{display:flex;align-items:center;gap:12px;margin:4px 2px 16px;border-bottom:1px solid rgba(216,167,43,.28);padding-bottom:12px}
.seal{width:52px;height:52px;flex:0 0 52px;border-radius:11px;background:linear-gradient(145deg,var(--red),var(--red2));
  color:#f6e7c6;display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1.1;text-align:center;letter-spacing:1px;
  box-shadow:inset 0 0 0 2px rgba(246,231,198,.55)}
.head h1{margin:0 0 3px;font-size:20px;letter-spacing:3px;color:#f0d38c;font-weight:600}
.head p{margin:0;font-size:12px;color:var(--muted);letter-spacing:1px}
.tabs{display:flex;background:rgba(28,24,21,.9);border:1px solid rgba(216,167,43,.25);border-radius:14px;overflow:hidden;margin-bottom:16px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.tab{flex:1;padding:14px 0;border:none;background:transparent;cursor:pointer;color:#a99574;font-size:15px;font-family:inherit;letter-spacing:1px;transition:.18s}
.tab:hover{color:#f0d38c;background:rgba(216,167,43,.08)}
.tab.active{color:#1a1512;font-weight:700;background:linear-gradient(180deg,#e8c372,#c79428);box-shadow:inset 0 0 0 1px rgba(246,231,198,.5)}
.panel{display:none;background:linear-gradient(180deg,rgba(30,26,22,.97),rgba(19,16,14,.98));border:1px solid rgba(216,167,43,.32);
  border-radius:18px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.6),inset 0 0 0 6px rgba(216,167,43,.05);position:relative}
.panel.active{display:block}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#d8a72b,transparent);opacity:.75}
.panel h2{margin:2px 0 14px;font-size:18px;letter-spacing:2px;color:#f0d38c;font-weight:600;text-align:center;padding-bottom:10px;border-bottom:1px dashed rgba(216,167,43,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:#cdb894;letter-spacing:.5px}
.field input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(216,167,43,.2);background:rgba(0,0,0,.35);
  color:#f2e5c8;font-family:ui-monospace,Menlo,monospace;font-size:15px;outline:none;transition:.18s}
.field input:focus{border-color:rgba(216,167,43,.65);box-shadow:0 0 0 3px rgba(216,167,43,.12)}
.bts{display:flex;gap:12px;margin:16px 0 4px}
.btn{flex:1;padding:14px 0;border-radius:12px;border:1px solid rgba(216,167,43,.3);cursor:pointer;font-size:16px;font-family:inherit;
  letter-spacing:2px;transition:transform .06s,box-shadow .18s,background .18s;box-shadow:0 4px 0 rgba(0,0,0,.5)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.calc{background:linear-gradient(180deg,var(--red),var(--red2));color:#f7e9c8;font-weight:700}
.reset{background:linear-gradient(180deg,#2a3f3a,#1b2a27);color:#bfe0d4}
.result{margin-top:14px}
.big{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:18px 10px;border:1px solid rgba(216,167,43,.25);
  border-radius:14px;background:radial-gradient(400px 120px at 50% 0,rgba(216,167,43,.14),rgba(0,0,0,.3));margin-bottom:12px}
.big .num{font-family:ui-monospace,Menlo,monospace;font-size:44px;color:#f0d38c;text-shadow:0 0 22px rgba(216,167,43,.3)}
.big .unit{font-size:14px;color:#cdb894;letter-spacing:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.cell{background:rgba(0,0,0,.3);border:1px solid rgba(216,167,43,.14);border-radius:12px;padding:12px 6px;text-align:center}
.cell .k{font-size:12px;color:#a99574;letter-spacing:1px;margin-bottom:6px}
.cell .v{font-family:ui-monospace,Menlo,monospace;font-size:18px;color:#f0d38c;word-break:break-all}
.hint{margin-top:12px;font-size:12.5px;color:#a9c9bf;background:rgba(47,107,95,.14);border-left:3px solid var(--jade);
  border-radius:0 10px 10px 0;padding:10px 12px;line-height:1.7}
.foot{margin-top:20px;display:flex;justify-content:space-between;font-size:11px;color:#7d6b50;letter-spacing:1px}
.foot .stars{color:#c9a34a;letter-spacing:2px}
</style>
</head>

    <div class="result" id="res-beast"></div>
  </section>

  <section class="panel" id="panel-armor">

      <div class="field"><label>云母石</label><input type="number" id="armor-yunmu" value="0" min="0"></div>
      <div class="field"><label>乌金石</label><input type="number" id="armor-wujin" value="0" min="0"></div>
      <div class="field"><label>金刚石</label><input type="number" id="armor-jingang" value="0" min="0"></div>
      <div class="field"><label>黑曜石</label><input type="number" id="armor-heiyao" value="0" min="0"></div>
    </div>
    <div class="bts"><button class="btn calc" data-calc="armor">算算能升多少</button><button class="btn reset" data-reset="armor">重置</button></div>
    <div class="result" id="res-armor"></div>
  </section>

  <section class="panel" id="panel-advisor">
    <h2>军师 · 手上这点货能升到几级</h2>
    <div class="grid">
      <div class="field"><label>当前等级（1-60）</label><input type="number" id="advisor-level" value="1" min="1" max="60"></div>

          <option value="2">单条技能</option>
          <option value="3">三条技能</option>

      </div>
    </div>
    <div class="bts"><button class="btn calc" data-calc="advisor">算算能升多少</button><button class="btn reset" data-reset="advisor">重置</button></div>
    <div class="result" id="res-advisor"></div>
  </section>

  </section>

  beast: { max:80, expKey:'upExp', mats:[['grass','灵草'],['wood','灵木'],['pill','灵丹']], rows:beastLevelData },
  armor: { max:60, expKey:'expNeed', mats:[['yunmu','云母石'],['wujin','乌金石'],['jingang','金刚石'],['heiyao','黑曜石']], rows:armorData },
  advisor: { max:60, expKey:'upExp', mats:[['yangyan','阳炎符'],['changsheng','长生符'],['shengren','圣人符']], rows:advisorData },
  altar: { max:90, expKey:null, mats:[['totalMaterial','祭坛材料']], rows:altarData }
};
const fmt = (n) => (Math.round(n)).toLocaleString('en-US');

function readNum(id){ const el = document.getElementById(id); return Math.max(0, Math.floor(Number(el && el.value) || 0)); }

function simulate(sys){
  const S = SYS[sys];
  const cur = Math.min(S.max, Math.max(1, readNum(sys + '-level')));
  const curExp = readNum(sys + '-exp');
  let expPool = readNum(sys + '-expool');
  const stock = {};
  for (const [k] of S.mats) stock[k] = readNum(sys + '-' + k);
  const multiplier = sys === 'advisor' ? Math.max(1, Math.min(3, Number(document.getElementById('advisor-mode')?.value) || 1)) : 1;

  const costOf = (level) => {
    const row = S.rows.find((r) => r.level === level) || {};
    const costs = {};
    let total = 0;
    for (const [k] of S.mats) {
      const per = Number(row[k] || 0) * multiplier;
      costs[k] = per;
      total += per;
    }
    return { row, costs, total };
  };
  const expOf = (level) => {
    const row = S.rows.find((r) => r.level === level) || {};
    return S.expKey ? Number(row[S.expKey] || 0) : 0;
  };

  let level = cur;
  let needExp = Math.max(0, expOf(level) - curExp);
  let consumedExp = 0;
  const consumedMats = {};
  for (const [k] of S.mats) consumedMats[k] = 0;
  let blocked = '';

  const tryOne = () => {
    const c = costOf(level);
    if (S.expKey && expPool < needExp) { blocked = '经验不够（还差 ' + fmt(needExp - expPool) + '）'; return false; }
    for (const [k] of S.mats) if (stock[k] < c.costs[k]) { blocked = '材料不够：' + (S.mats.find((m) => m[0] === k)[1]) + ' 差 ' + fmt(c.costs[k] - stock[k]); return false; }
    if (S.expKey) { expPool -= needExp; consumedExp += needExp; }
    for (const [k] of S.mats) { stock[k] -= c.costs[k]; consumedMats[k] += c.costs[k]; }
    level += 1;
    needExp = S.expKey ? expOf(level) : 0;
    return true;
  };

  // 先把当前等级的经验补齐
  if (needExp > 0) {
    if (!tryOne()) {
      return { cur, level, gained: 0, blocked, next: nextInfo(sys, level, curExp, expPool, stock, multiplier) };
    }
  }
  while (level < S.max) {
    if (!tryOne()) break;
  }
  return {
    cur, level, gained: level - cur, blocked,
    consumedExp, consumedMats, leftoverExp: expPool, leftoverMats: stock,
    next: nextInfo(sys, level, 0, expPool, stock, multiplier)
  };
}

function nextInfo(sys, level, curExp, expPool, stock, multiplier){
  const S = SYS[sys];
  const row = S.rows.find((r) => r.level === level);
  if (!row || level >= S.max) return null;
  const needExp = S.expKey ? Math.max(0, Number(row[S.expKey] || 0) - curExp) : 0;
  const mats = S.mats.map(([k, name]) => ({ name, need: Number(row[k] || 0) * multiplier, have: stock[k] })).filter((x) => x.need > 0 || x.have > 0);
  return { level, needExp, expShort: Math.max(0, needExp - expPool), mats };
}

function render(sys){
  const r = simulate(sys);
  const S = SYS[sys];
  const el = document.getElementById('res-' + sys);
  const nameOf = (k) => (S.mats.find((m) => m[0] === k) || [k, k])[1];
  const cards = [];
  cards.push(['升了几级', '+' + fmt(r.gained)]);
  if (S.expKey) {
    cards.push(['用掉经验', fmt(r.consumedExp)]);
    cards.push(['剩经验', fmt(r.leftoverExp)]);
  }
  for (const [k] of S.mats) {
    if (r.consumedMats && r.consumedMats[k]) cards.push(['用掉' + nameOf(k), fmt(r.consumedMats[k])]);
    if (r.leftoverMats && r.leftoverMats[k]) cards.push(['剩' + nameOf(k), fmt(r.leftoverMats[k])]);
  }
  let hint = '';
  if (r.next) {
    const parts = [];
    if (r.next.needExp) parts.push('经验 ' + fmt(r.next.needExp) + (r.next.expShort ? '（差 ' + fmt(r.next.expShort) + '）' : ''));
    for (const m of r.next.mats) if (m.need > 0) parts.push(m.name + ' ' + fmt(m.need) + (m.need > m.have ? '（差 ' + fmt(m.need - m.have) + '）' : ''));
    hint = '再升一级（' + r.next.level + ' → ' + (r.next.level + 1) + '）要：' + parts.join('、');
  } else {
    hint = '到顶了，' + S.max + ' 级。';
  }
  el.innerHTML =
    '<div class="big"><span class="num">' + r.level + '</span><span class="unit">级</span></div>' +
    '<div class="cards">' + cards.map(([k, v]) => '<div class="cell"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>').join('') + '</div>' +
    '<div class="hint">' + (r.blocked ? '卡在：' + r.blocked + '。' : '') + hint + '</div>';
}

    document.getElementById('panel-' + btn.dataset.sys).classList.add('active');

});
document.querySelectorAll('.calc').forEach((btn) => btn.addEventListener('click', () => render(btn.dataset.calc)));
document.querySelectorAll('.reset').forEach((btn) => btn.addEventListener('click', () => {
  const sys = btn.dataset.reset;
  const S = SYS[sys];
  document.getElementById(sys + '-level').value = 1;
  if (S.expKey) { document.getElementById(sys + '-exp').value = 0; document.getElementById(sys + '-expool').value = 0; }
  for (const [k] of S.mats) document.getElementById(sys + '-' + k).value = 0;
  document.getElementById('res-' + sys).innerHTML = '';
}));
